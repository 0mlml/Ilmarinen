name: Release Build

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for bump_version
        run: chmod +x ./scripts/bump_version.sh
      - name: Bump version (add -dev if not present)
        run: ./scripts/bump_version.sh dev
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilmarinen-jar
          path: build/libs/*.jar

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Remove -dev from version
        run: ./scripts/bump_version.sh release
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilmarinen-jar
          path: build/libs/*.jar
