name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'
      - name: Remove -dev from version.txt
        run: |
          VERSION=$(cat src/main/resources/version.txt)
          RELEASE_VERSION=$(echo $VERSION | sed 's/-dev//')
          echo $RELEASE_VERSION > src/main/resources/version.txt
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add src/main/resources/version.txt
          git commit -m "Release $RELEASE_VERSION [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilmarinen-jar
          path: build/libs/*.jar 
