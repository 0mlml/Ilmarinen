plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

jar {
    manifest {
        attributes('Main-Class': 'dev.mlml.Ilmarinen')
    }
}

compileJava { options.encoding = "UTF-8" }
compileTestJava { options.encoding = "UTF-8" }

var jacksonVersion = '2.13.4'
var lombokVersion = '1.18.38'
var logbackVersion = '1.5.6'
var jdaVersion = '5.6.1'
var lavaplayerVersion = '2.2.4'
var lavalinkVersion = '1.13.4'

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
    maven {
        url "https://maven.lavalink.dev/releases"
    }
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion"
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:$jacksonVersion'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    implementation "ch.qos.logback:logback-classic:$logbackVersion"
    implementation("net.dv8tion:JDA:$jdaVersion") {
        exclude module: 'opus-java'
    }

    implementation "dev.arbjerg:lavaplayer:$lavaplayerVersion"
    implementation "dev.lavalink.youtube:v2:$lavalinkVersion"
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes['Main-Class'] = 'dev.mlml.Ilmarinen'
    }
}